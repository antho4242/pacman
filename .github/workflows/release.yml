name: Release Automation

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    # Ne s'exécute que si la PR est effectivement mergée
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      
      - name: Analyze commits and determine version bump
        id: version_bump
        run: |
          echo "Analyzing commits from PR..."
          
          # Récupérer tous les commits de la PR
          COMMITS=$(git log --format=%s ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          echo "Commits in PR:"
          echo "$COMMITS"
          
          # Déterminer le type de bump selon Semantic Versioning
          if echo "$COMMITS" | grep -qiE "^BREAKING CHANGE:|^[a-z]+(\(.+\))?!:"; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Found BREAKING CHANGE - will bump MAJOR version"
          elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Found feat - will bump MINOR version"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Found fix/chore/etc - will bump PATCH version"
          fi
      
      - name: Create tag and generate changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: ${{ steps.version_bump.outputs.bump }}
          tag_prefix: v
          release_branches: main
          create_annotated_tag: true
      
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## 🎮 Pac-Man Game - ${{ steps.tag_version.outputs.new_tag }}
            
            ### 📋 Changelog
            ${{ steps.tag_version.outputs.changelog }}
            
            ---
            **Version précédente:** ${{ steps.tag_version.outputs.previous_tag }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}